name: Pricing refresh

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pricing-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails loudly on any validation error. Nothing is written in that case, so the last known good snapshot stays live.
      - name: Fetch, validate and write a new dated snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run pricing:refresh
      - name: Validate all snapshots
        run: npm run pricing:validate
      - name: Unit tests against the new snapshot
        run: npm test
      - name: Commit the snapshot
        run: |
          git config user.name "pricing-refresh"
          git config user.email "pricing-refresh@users.noreply.github.com"
          git add public/pricing
          if git diff --cached --quiet; then
            echo "No new snapshot."
          else
            git commit -m "Pricing snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
